title: ANTIBODY

# Published origin of this node. Read by the Atlas matchmaker (atlas/bin/match via
# .github/workflows/match.yml) as the `atlas_url` it signs into /matches.json, so this
# self-hosted Atlas attributes matches to its own URL rather than the upstream default.
url: "https://antibody.fort-collins.colorado.anecdote.channel"

# The workspace root is the publish root. Journal prose lives at journal/ and
# serves at /journal/ (disk path == url path; the engine ships the `journal` mount
# default, so this node need not repeat it). Engine machinery is hidden under the
# dotted .*-engine submodules.

# Site-owned exclude. Declaring it here REPLACES the engine default on merge, so it
# re-lists the engine's entries. The dotted .*-engine mounts are also auto-ignored
# by Jekyll (dotfiles); atlas/, tell/, and antidote/ are reserved pass-through
# prefixes, built and deployed by their own engines — never by this node's Jekyll build.
exclude:
  # NAME is deliberately NOT excluded — it is this node's published claim about where it belongs,
  # and a claim nobody can fetch is not a claim. CNAME stays excluded: host plumbing, not a
  # statement this node is making.
  - CNAME
  - .bundle
  - Gemfile
  - Gemfile.lock
  - vendor
  - .journal-engine/
  - .atlas-engine/
  - .tell-engine/
  - .antidote-engine/
  - .library-engine/
  - atlas/
  - tell/
  - antidote/
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - LICENSE.md
  - AGENTS.md
  - .github
  - bin

license_badge: https://img.shields.io/static/v1?label=Hippocratic%20License&message=HL3-BDS-MEDIA-SUP-SV&labelColor=5e2751&color=2a6a65
license_url: https://firstdonoharm.dev/version/3/0/bds-media-sup-sv.html
civic_node: Fort Collins
civic_abbr: FCCN
civic_tag: For immediate replication
repo_url: https://github.com/FCCN-ANTIBODY/civic-node
repo_name: FCCN-ANTIBODY/civic-node

# What the footer's Search link covers, OR'd into one GitHub code search (engine:
# .journal-engine/_layouts/root.html). This node's own repo is here because the machinery and
# the constitution prose live in it; `journal/autumn-ryan` is here because that is where the
# JOURNAL lives — it was published from this repo once, and the link went on pointing at the
# repo after the prose left for a citation journal of its own. A search that cannot reach the
# writing is not a search of this journal.
#
# A name in this list is not enough on its own: the query's term is `hippocratic`, an example
# term because an empty code search is not a valid starting state, and it matches only because
# every repository in the constellation carries the license reference. cite-autumn-ryan
# contained the word zero times until tiliv/cite-autumn-ryan#7 gave it a README carrying the
# badge and the authors' clause. Add a repository here and put the license where its words are.
#
# Every mounted citation journal belongs in this list; today there is one. Two things this does
# NOT solve, deferred in OPEN-QUESTIONS.md "BB": `repo:` does not follow submodules, and
# cite-autumn-ryan is headed for exactly that — roughly ten of its pieces are to become
# repositories of their own, at which point listing the journal here stops reaching them; and a
# list kept by hand goes stale the first time an author is added without touching this file.
search_repos:
  - FCCN-ANTIBODY/civic-node
  - tiliv/cite-autumn-ryan

og_description: >-
  We assert that there are degrees of information quality, that we must not
  struggle to distinguish them and that they are these: 1) First-party claims
  with metadata, 2) Hearsay and 3) Fraud.

preferences:
  dark: false
  year: "2026"
