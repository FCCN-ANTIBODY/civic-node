{% capture _src -%}
{{ include.location | default: './exhibits' }}/{{ include.file }}
{%- endcapture -%}
<aside class="{% if include.side %}side {{ include.side }}{% endif %}">
  <iframe
    src="{{ include.url | default: _src }}"
    title="{{ include.overview }}"
    width="{% if include.width %}{{ include.width }}px{% else %}100%{% endif %}"
    height="{{ include.height | default: 400 }}px"
    frameBorder="0"
    sandbox="{% if include.sandbox %}{{ include.sandbox }}{% else %}allow-scripts allow-same-origin{% endif -%}"
    {% if include.allowfullscreen %}allowfullscreen{% endif %}
    {% if include.referrerpolicy %}referrerpolicy="{{ include.referrerpolicy }}"{% endif %}
    {% if include.allow %}allow="{{ include.allow }}"{% endif %}
    {% if include.style %}style="{{ include.style }}"{% endif %}></iframe>
  <figcaption>{{ include.caption }}</figcaption>
</aside>
