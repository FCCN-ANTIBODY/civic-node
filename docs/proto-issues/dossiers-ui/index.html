<!doctype html>
<meta charset="utf-8">
<title>Dossiers</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>
:root{
  --paper:#f7f4ed; --ink:#1e1b16; --rule:#ded7c8; --side:#efe9dc;
  --muted:#7d7466; --stamp:#9b2c2c; --cite:#2f5d78;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --bar:0px;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif)}

/* top bar — phone only */
#bar{display:none;position:fixed;top:0;left:0;right:0;height:52px;z-index:30;
  background:var(--side);border-bottom:1px solid var(--rule);
  align-items:center;gap:12px;padding:0 14px;padding-top:env(safe-area-inset-top)}
#bar button{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);border-radius:3px;padding:10px 12px;color:var(--ink)}
#bar .now{font-family:var(--serif);font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#side{position:fixed;top:0;bottom:0;left:0;width:224px;background:var(--side);
  border-right:1px solid var(--rule);padding:22px 0 40px;overflow-y:auto;z-index:20}
#side h1{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px;padding:0 18px}
.grp{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 8px;padding:0 18px}
.d{display:block;width:100%;text-align:left;background:none;border:0;
   font-family:var(--serif);font-size:21px;line-height:1.22;padding:11px 18px;color:var(--ink)}
.d:hover{background:#e6dfd0}
.d[aria-current=true]{background:var(--paper);box-shadow:inset 3px 0 0 var(--stamp);font-weight:600}
.d small{display:block;font:400 10.5px/1.35 var(--sans);color:var(--muted);margin-top:4px}

#main{margin-left:224px;padding:34px 46px 130px;max-width:840px}
header.doc{border-bottom:2px solid var(--ink);padding-bottom:14px}
header.doc .kind{font:700 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--stamp)}
header.doc h2{font-size:38px;margin:8px 0 6px;font-weight:600;letter-spacing:-.01em}
header.doc .about{font:400 12.5px/1.5 var(--sans);color:var(--muted)}
.state{font:600 9.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;
  padding:4px 7px;border-radius:2px;vertical-align:middle;margin-left:10px}
.state.scratch{background:#e6dfd0;color:#7d7466}
.state.standalone{background:var(--stamp);color:#fff}

#spread{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0 30px}
.chip{font-family:var(--mono);font-size:10.5px;padding:4px 8px;border:1px solid var(--rule);
  border-radius:2px;color:var(--muted);background:#fff}
.chip.canon{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip.absent{opacity:.4;border-style:dashed;text-decoration:line-through}

.frag{border:1px solid var(--rule);background:#fffdf8;margin:0 0 16px}
.fhead{display:flex;align-items:baseline;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--rule);background:#f4efe3;flex-wrap:wrap}
.fname{font-family:var(--mono);font-size:12.5px;font-weight:600}
.fname.canon{text-transform:uppercase;color:var(--stamp)}
.prov{font:400 10.5px/1.4 var(--sans);color:var(--muted);margin-left:auto}
.fbody{padding:15px 18px;font-size:17px;line-height:1.62}
.fbody p{margin:0 0 .7em}.fbody p:last-child{margin:0}
.noticed{margin:0;padding:9px 18px;border-top:1px dotted var(--rule);background:#fbf7ec;
  font:400 11.5px/1.5 var(--sans);color:#8a6d3b}
.noticed b{font-weight:600}

.node{margin:36px 0 0;background:#211d18;color:#ece5d8}
.node h3{font:600 10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  margin:0;padding:13px 18px;color:#b9ac95;border-bottom:1px solid #3a342b}
.node .sub{font:400 11.5px/1.55 var(--sans);color:#8d8272;padding:11px 18px 0}
.row{display:flex;gap:14px;padding:11px 18px;border-bottom:1px solid #322c24;align-items:baseline;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .k{font-family:var(--mono);font-size:11px;color:#c9a227;flex:0 0 130px}
.row .v{flex:1;font:400 12.5px/1.5 var(--sans);min-width:150px}
.row .t{font-family:var(--mono);font-size:10.5px;color:#8d8272;margin-left:auto}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7ac74f;margin-right:6px}

#foot{position:fixed;bottom:0;left:224px;right:0;background:#efe9dc;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--muted);padding:7px 46px;display:flex;gap:18px;
  padding-bottom:calc(7px + env(safe-area-inset-bottom));z-index:15}
#foot b{color:var(--ink)}
.note{font:400 12.5px/1.5 var(--sans);color:var(--muted);border-left:2px solid var(--rule);
  padding-left:12px;margin:26px 0 0}
#scrim{display:none;position:fixed;inset:0;background:rgba(30,27,22,.42);z-index:19}

/* ------------------------------------------------- phone */
@media (max-width:760px){
  #bar{display:flex}
  body{padding-top:calc(52px + env(safe-area-inset-top))}
  #side{transform:translateX(-102%);transition:transform .22s ease;width:82vw;max-width:310px;
    padding-top:calc(70px + env(safe-area-inset-top));box-shadow:2px 0 18px rgba(0,0,0,.18)}
  body.drawer #side{transform:none}
  body.drawer #scrim{display:block}
  #main{margin-left:0;padding:22px 18px 128px}
  header.doc h2{font-size:30px}
  .d{font-size:22px;padding:13px 18px}
  #foot{left:0;padding:7px 18px;gap:12px;font-size:10px;overflow-x:auto;white-space:nowrap}
  .fbody{font-size:16.5px;padding:14px 15px}
  .row .k{flex-basis:100%}.row .t{margin-left:0}
}
</style>

<div id="bar"><button id="menu">Library</button><span class="now"></span></div>
<div id="scrim"></div>
<nav id="side"><h1>Library</h1><div id="list"></div></nav>
<main id="main"><p style="color:#7d7466;font-family:var(--sans)">Loading…</p></main>
<div id="foot"></div>

<script>
const CANON = ["NAME","CONSTITUTION"];
const $ = s => document.querySelector(s);
let DATA = null, openId = null;

// A deliberately small markdown: paragraphs, bold, italic, and nothing else.
// Fragments are prose. Anything cleverer would be a build step.
function md(t){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return t.trim().split(/\n\s*\n/).map(p =>
    "<p>" + esc(p).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
                  .replace(/\*([^*]+)\*/g,"<em>$1</em>")
                  .replace(/\n/g," ") + "</p>").join("");
}

// Noticing, never validating: report what stands out, hold no vocabulary for it.
function notice(name, text, d){
  if (!text.trim()) return "<b>Empty.</b> An empty fragment is honest, and it is still a claim that this belongs here.";
  if (/\{\{[^}]+\}\}/.test(text))
    return "Uses <b>{{…}} templating</b> in a file that is otherwise bespoke. If nobody else mounts this, the variable is buying nothing.";
  return null;
}

async function load(){
  DATA = await (await fetch("/index.json",{cache:"no-store"})).json();
  if (!DATA.dossiers.length){ $("#main").innerHTML =
    "<p style='font-family:var(--sans);color:#7d7466'>No dossiers in <code>"+DATA.root+"</code>. Make a folder, put a <code>.md</code> in it, pull to refresh.</p>"; return; }
  if (!DATA.dossiers.find(d=>d.id===openId)) openId = DATA.dossiers[0].id;
  sidebar(); render();
}

function sidebar(){
  $("#list").innerHTML = "";
  DATA.dossiers.forEach(d=>{
    const b = document.createElement("button");
    b.className = "d"; b.setAttribute("aria-current", d.id===openId);
    b.innerHTML = d.id + "<small>"+d.fragments.length+" fragments · "+d.state+"</small>";
    b.onclick = ()=>{ openId=d.id; document.body.classList.remove("drawer"); sidebar(); render();
                      window.scrollTo(0,0); };
    $("#list").appendChild(b);
  });
}

async function render(){
  const d = DATA.dossiers.find(x=>x.id===openId);
  $("#bar .now").textContent = d.id;
  const m = $("#main"); m.innerHTML = "";

  m.insertAdjacentHTML("beforeend",
    `<header class="doc"><div class="kind">dossier</div>
     <h2>${d.id}<span class="state ${d.state}">${d.state}</span></h2>
     <div class="about">${d.fragments.length} fragments · served from disk, enumerated on every request</div></header>`);

  const all  = [...new Set(DATA.dossiers.flatMap(x=>x.fragments.map(f=>f.n)))].sort();
  const here = new Set(d.fragments.map(f=>f.n));
  m.insertAdjacentHTML("beforeend","<div id='spread'>"+ all.map(n=>
    `<span class="chip ${CANON.includes(n)?"canon":""} ${here.has(n)?"":"absent"}">${n}</span>`).join("")+"</div>");

  if (!here.has("NAME")) m.insertAdjacentHTML("beforeend",
    `<p class="noticed" style="border:1px dotted var(--rule);margin:0 0 16px">noticed —
     <b>no NAME fragment.</b> Described but never named, which is how a dossier collapses into an
     archetype. Absence is reported, never repaired.</p>`);

  for (const f of d.fragments){
    const text = await (await fetch("/d/"+d.id+"/"+f.n+"."+f.ext,{cache:"no-store"})).text();
    const note = notice(f.n, text, d);
    m.insertAdjacentHTML("beforeend",
      `<section class="frag"><div class="fhead">
         <span class="fname ${CANON.includes(f.n)?"canon":""}">${f.n}</span>
         <span class="prov">${f.bytes} bytes · ${new Date(f.mtime*1000).toLocaleDateString()}</span>
       </div><div class="fbody">${md(text)}</div>` +
      (note ? `<p class="noticed">noticed — ${note}</p>` : ``) + `</section>`);
  }

  const rooms = (d.node.rooms)||[], hist = (d.node.history)||[];
  const row = r => `<div class="row"><span class="k">${r.live?'<span class="live"></span>':""}${r.k}</span>
     <span class="v">${r.v}</span><span class="t">${r.t}</span></div>`;
  m.insertAdjacentHTML("beforeend", `<div class="node">
    <h3>What this node knows</h3>
    <div class="sub">Not part of the dossier. Not authored, not cited, not carried when someone takes
      from this — it is what the node observed, and it would be empty on a node that only keeps notes.</div>
    ${rooms.length?`<div style="padding-top:8px">${rooms.map(row).join("")}</div>`
      :`<div class="row"><span class="v" style="color:#8d8272">In no rooms. Nothing has mounted this.</span></div>`}
    ${hist.length?`<h3 style="border-top:1px solid #3a342b">Work history · emergent</h3>
      <div class="sub">Nobody planned to collect this. It fell out of aggregation — and it only ever
        sees engagements that ran <b>here</b>.</div>
      <div style="padding-top:8px">${hist.map(row).join("")}</div>`:""}
  </div>`);

  m.insertAdjacentHTML("beforeend", `<p class="note">Read-only. Add a file to
    <code>${DATA.root}/${d.id}/</code> and refresh — the name is whatever you type, and nothing
    validates it.</p>`);

  $("#foot").innerHTML = `<span>${DATA.root}/<b>${d.id}</b>/</span>`+
    `<span>${d.fragments.length} fragments · ${CANON.filter(c=>here.has(c)).length}/2 canon</span>`+
    `<span><b>${d.state}</b></span>`;
}

$("#menu").onclick = ()=> document.body.classList.toggle("drawer");
$("#scrim").onclick = ()=> document.body.classList.remove("drawer");
load();
</script>
